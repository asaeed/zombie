<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dead Zone RTS</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="stylesheet" href="style.css?v=20261015-activity-modal-r1">
</head>
<body>
  <main id="start-screen">
    <img id="start-backdrop" src="assets/rigged-full/intro.webp" alt="" fetchpriority="high">
    <div class="start-content">
      <p class="start-eyebrow">ENDLESS SURVIVAL RTS</p>
      <h1>Dead Zone</h1>
      <p class="start-intro">Your last foothold in a city overrun.</p>
      <div class="start-loading" aria-busy="true">
        <div class="start-loading-label"><span id="asset-status" role="status" aria-live="polite">Preparing assets...</span><span id="asset-percent" aria-hidden="true">0%</span></div>
        <progress id="asset-progress" max="1" value="0" aria-label="Game assets"></progress>
        <p id="asset-detail">Downloading the final game artwork.</p>
      </div>
      <div class="start-actions">
        <button id="start-game" type="button" disabled>Start game</button>
        <button id="retry-assets" type="button" hidden>Retry download</button>
      </div>
      <noscript>JavaScript is required to play Dead Zone.</noscript>
    </div>
    <footer class="start-footer">
      <p>Created by <a href="https://github.com/asaeed" target="_blank" rel="noopener noreferrer">asaeed</a></p>
      <a href="https://github.com/asaeed/zombie" target="_blank" rel="noopener noreferrer">View source on GitHub</a>
    </footer>
  </main>
  <canvas id="canvas" tabindex="-1" hidden></canvas>
  <a id="source-code-link" href="https://github.com/asaeed/zombie" target="_blank" rel="noopener noreferrer" hidden>Source code</a>
  <span id="cookie-notice" hidden>No cookies used</span>
  <button id="activity-expand" type="button" class="hud-icon-button" aria-label="Open activity history" title="Open activity history" aria-haspopup="dialog" aria-controls="activity-dialog" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="maximize-2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
  </button>
  <dialog id="activity-dialog" aria-labelledby="activity-title" aria-describedby="activity-count">
    <header class="activity-header">
      <div><h2 id="activity-title">Activity</h2><p id="activity-count">0 events</p></div>
      <button id="activity-close" type="button" class="hud-icon-button" aria-label="Close activity history" title="Close" autofocus>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="x"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <p id="activity-empty">All quiet</p>
    <ol id="activity-list" tabindex="0" aria-label="Activity events, newest first"></ol>
  </dialog>
  <script defer src="js/config.js?v=20261109-heavy-retreat-r1"></script>
  <script defer src="js/utils.js?v=20261109-selection-retaliation-r1"></script>
  <script defer src="js/pathfinding.js?v=20261015-zombie-routing-r1"></script>
  <script defer src="js/entities.js?v=20261109-heavy-retreat-r1"></script>
  <script defer src="js/game.js?v=20261109-heavy-retreat-r1"></script>
  <script defer src="js/art.js?v=20261031-combat-deaths-r1"></script>
  <script defer src="js/renderer.js?v=20261109-medic-indicator-r1"></script>
  <script defer src="js/input.js?v=20261109-remove-attack-move-r1"></script>
  <script defer src="js/main.js?v=20261015-activity-modal-r1"></script>
</body>
</html>
