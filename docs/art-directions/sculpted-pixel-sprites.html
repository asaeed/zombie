<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dead Zone - Sculpted Pixel sprites</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#202723;color:#eff2ed;font:14px system-ui,sans-serif;letter-spacing:0}
    header,main{max-width:1120px;margin:auto;padding:20px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #45524a}
    h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 12px}a{color:#d5e5b2;text-decoration:none}a:hover{text-decoration:underline}
    nav,.toolbar,.segment,.backgrounds,.playback,.downloads{display:flex;align-items:center;gap:10px;flex-wrap:wrap}nav{gap:20px}
    .toolbar{justify-content:space-between;margin-bottom:18px}.segment{gap:0;border:1px solid #71806c;border-radius:4px;overflow:hidden}
    button,select,input{font:inherit}button,select{background:#2e3c32;color:#ecf1e9;border:1px solid #667b60;border-radius:4px;padding:7px 11px;cursor:pointer}
    .segment button{border:0;border-radius:0;min-width:75px}.segment button[aria-pressed=true]{background:#d3de9a;color:#15251a}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #a8d9dc;outline-offset:3px}button:hover{filter:brightness(1.12)}
    .icon{width:34px;height:34px;padding:6px;display:grid;place-items:center}.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    label{display:flex;align-items:center;gap:7px}.stages{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}.stage{background:#34483a;min-height:305px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:4px}
    canvas{display:block;image-rendering:pixelated}#large{width:288px;height:288px}#game{width:100%;max-width:420px;height:305px}
    .playback{padding:12px 0;border-top:1px solid #45524a;border-bottom:1px solid #45524a}#frame{flex:1;min-width:100px;accent-color:#d3de9a}#frameName{min-width:60px;font-variant-numeric:tabular-nums}
    #speed{width:100px;accent-color:#d3de9a}.swatch{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid transparent}.swatch[aria-pressed=true]{border-color:#fff}
    .swatch[data-bg=terrain]{background:#34483a}.swatch[data-bg=dark]{background:#1e2421}.swatch[data-bg=light]{background:#d8dfd6}
    .details{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:14px 0 24px;color:#becebc}.downloads{gap:20px}
    .views{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid #45524a;padding:20px 0}.views canvas{width:100%;height:auto;background:#34483a}
    .strip{overflow-x:auto;background:#34483a;margin-bottom:20px}.strip canvas{height:128px;width:auto}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px}
    .section-title h2{margin:0 0 12px}#status{font-size:12px;color:#bfcdba}#failure{color:#ffcabb}
    @media(max-width:700px){header{align-items:start;flex-direction:column;gap:12px}header,main{padding:16px}.stages{grid-template-columns:1fr;gap:14px}.stage{min-height:260px}#large{width:256px;height:256px}.views{grid-template-columns:1fr}.toolbar{gap:12px}.playback{gap:7px}.playback label{width:100%}}
  </style>
</head>
<body>
  <header><h1>Sculpted Pixel</h1><nav><a href="sculpted-world.html">Full scene</a><a href="../../?artPilot=sculpted">In game</a><a href="focused-sculpted-pixel.png">Concept</a></nav></header>
  <main>
    <div class="toolbar">
      <label>Character <select id="characters"><option>Loading</option></select></label>
      <div class="segment" id="actions"></div>
      <label>Facing <select id="direction"><option value="S">S</option><option value="SE" selected>SE</option><option value="E">E</option><option value="NE">NE</option><option value="N">N</option><option value="NW">NW</option><option value="W">W</option><option value="SW">SW</option></select></label>
      <div class="backgrounds"><button class="swatch" data-bg="terrain" aria-label="Terrain background" title="Terrain" aria-pressed="true"></button><button class="swatch" data-bg="dark" aria-label="Dark background" title="Dark" aria-pressed="false"></button><button class="swatch" data-bg="light" aria-label="Light background" title="Light" aria-pressed="false"></button></div>
    </div>
    <p id="failure" hidden></p>
    <div class="stages"><section><h2>Enlarged</h2><div class="stage"><canvas id="large" width="384" height="384"></canvas></div></section><section><h2>Game size</h2><div class="stage"><canvas id="game" width="420" height="305"></canvas></div></section></div>
    <div class="playback">
      <!-- Lucide Play, Pause, ChevronLeft and ChevronRight icon geometry. -->
      <button class="icon" id="play" type="button" title="Pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M6 3h4v18H6zM14 3h4v18h-4z"></path></svg></button>
      <button class="icon" id="previous" type="button" title="Previous frame" aria-label="Previous frame"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button class="icon" id="next" type="button" title="Next frame" aria-label="Next frame"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></button>
      <input id="frame" aria-label="Animation frame" type="range" min="0" max="11" value="0"><output id="frameName">1 / 12</output>
      <label>Speed <input id="speed" type="range" min="0.25" max="1.5" step="0.25" value="1"><output id="speedName">1x</output></label>
    </div>
    <div class="details"><span id="status">Loading</span><div class="downloads"><a id="png" download>PNG atlas</a><a id="json" download>Frame data</a></div></div>
    <div class="section-title"><h2>Eight facings</h2><span id="fps"></span></div>
    <div class="views"><canvas id="directions" width="512" height="256"></canvas><canvas id="contact" width="512" height="256"></canvas></div>
    <h2>Animation frames</h2><div class="strip"><canvas id="strip" width="1536" height="128"></canvas></div>
  </main>
  <script type="module" src="sculpted-pixel-sprites.mjs"></script>
</body></html>
