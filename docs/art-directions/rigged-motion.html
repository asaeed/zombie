<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rigged Motion Trial</title><link rel="icon" href="../../assets/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0ee;color:#233a35;font:14px system-ui;letter-spacing:0}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:18px 22px;background:#fff;border-bottom:1px solid #cad2ce}h1{font-size:22px;margin:0}nav{margin-left:auto;display:flex;gap:18px}a{color:#256c70}main{max-width:1200px;margin:auto;padding:20px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;height:34px;border:1px solid #90a8a0;border-radius:4px;background:white;color:inherit;padding:3px 8px}button{width:34px;cursor:pointer}input[type=range]{width:115px}.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#c4ccbc;border:1px solid #c4ccbc}.view{min-width:0;background:#879665;text-align:center;padding:10px 4px}.view.dark{background:#283934;color:#dce6dc}.view>canvas{display:block;max-width:100%}.native{display:flex;height:55px;justify-content:center;align-items:flex-end}.caption{display:flex;justify-content:space-evenly;font-size:11px;margin:8px 0}.direction{font-size:12px;margin:6px 0}.film{overflow:auto;background:#9ea995;padding:14px;margin-top:10px}.film canvas{display:block}h2{font-size:15px;margin:22px 0 12px}.frame-counter{min-width:55px;font-variant-numeric:tabular-nums}.status{color:#972d25}@media(max-width:680px){main{padding:12px}header{padding:14px}nav{margin-left:0}.views{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{gap:10px}}
</style></head><body><header><h1>Rigged Motion Trial</h1><nav><a href="brushwork-full-sprites.html">Painted Sprites</a><a href="brushwork-full-world.html">Outpost</a></nav></header><main>
<div class="controls"><label>Unit <select id="unit"><option>soldier</option><option>walker</option></select></label><label>Action <select id="action"></select></label>
<button id="play" title="Pause" aria-label="Pause">&#10074;&#10074;</button><button id="previous" title="Previous frame" aria-label="Previous frame">&#9664;</button><button id="next" title="Next frame" aria-label="Next frame">&#9654;</button>
<label>Frame <input id="frame" type="range" min="0" max="15" value="0"></label><output id="counter" class="frame-counter"></output>
<label>Speed <select id="speed"><option value="1">1x</option><option value="0.5">0.5x</option><option value="0.25">0.25x</option></select></label>
<label>Light <select id="light"><option value="day">Day</option><option value="night">Night</option></select></label></div>
<div class="views" id="views"></div><h2>Complete Cycle</h2><label>Facing <select id="facing"></select></label><div class="film"><canvas id="film"></canvas></div><p id="error" class="status" hidden></p>
</main><script type="module" src="rigged-motion.mjs"></script></body></html>
