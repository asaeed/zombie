<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brushwork Motion Comparison</title><link rel="icon" href="../../assets/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2ef;color:#273936;font:14px system-ui,sans-serif;letter-spacing:0}header{padding:16px 22px;background:white;border-bottom:1px solid #c8d2cf;display:flex;align-items:center;gap:22px;flex-wrap:wrap}h1{font-size:22px;margin:0}nav{display:flex;gap:18px;margin-left:auto}a{color:#276e72;text-decoration:none}a:hover{text-decoration:underline}main{max-width:1120px;margin:auto;padding:20px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}label{display:flex;gap:7px;align-items:center}select,button{font:inherit;border:1px solid #8eaaa4;border-radius:4px;background:white;color:inherit;height:34px;padding:3px 8px}button{width:34px;font-size:18px;cursor:pointer}button:hover{background:#d9e8e3}input[type=range]{width:110px;accent-color:#26757a}.comparison{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#c3cebe;border:1px solid #c3cebe}.sample{min-width:0;background:#8e9b64;text-align:center;padding:12px 4px}.sample.dark{background:#293832;color:#e4ebe6}.sample h2{font-size:15px;font-weight:600;margin:0 0 8px}.sample canvas{display:block;margin:auto;max-width:100%;height:auto;image-rendering:pixelated}.sample .native{margin-top:8px}.caption{margin:5px 0;font-size:12px}.counter{font-variant-numeric:tabular-nums;min-width:80px}.strip{background:#b1b0a0;overflow:auto;padding:12px;margin-top:18px}.strip canvas{display:block;image-rendering:pixelated}#error{color:#9c3223} @media(max-width:780px){header{padding:14px}main{padding:12px}nav{margin-left:0}.comparison{grid-template-columns:1fr}.controls{gap:10px}.sample{padding:12px}}
</style></head><body>
<header><h1>Brushwork Motion</h1><nav><a href="brushwork-walk.html">New Walks</a><a href="../../?artPack=brushwork">Play</a><a href="brushwork-world.html?artPack=brushwork">Outpost</a><a href="brushwork-sprites.html">All Sprites</a></nav></header>
<main><div class="controls">
<label>Unit <select id="unit"><option value="soldier">Soldier</option><option value="walker">Walker</option></select></label>
<label>Reference <select id="reference"><option value="scout">Scout</option><option value="original">Original (filtered)</option><option value="mesh">Sharp (mesh)</option></select></label>
<button id="play" title="Pause" aria-label="Pause">&#10074;&#10074;</button><button id="previous" title="Previous frame" aria-label="Previous frame">&#9664;</button><button id="next" title="Next frame" aria-label="Next frame">&#9654;</button>
<label>Frame <input id="frame" type="range" min="0" max="7" value="0"></label><output id="counter" class="counter"></output>
<label>FPS <input id="fps" type="range" min="4" max="16" value="10"><output id="rate">10</output></label>
<label>Zoom <select id="zoom"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option><option value="6" selected>6x</option></select></label>
<label>Background <select id="background"><option value="day">Day</option><option value="night">Night</option></select></label>
<label><input id="anchors" type="checkbox">Anchors</label>
<output>SE / Walk / Pilot</output></div>
<div id="comparison" class="comparison"></div><div class="strip"><canvas id="strip"></canvas></div><p id="error" hidden></p></main>
<script type="module" src="brushwork-motion.mjs"></script></body></html>
