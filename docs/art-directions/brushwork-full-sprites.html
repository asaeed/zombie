<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brushwork Layered - Sprites</title><link rel="icon" href="../../assets/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2ef;color:#273936;font:14px system-ui,sans-serif;letter-spacing:0}header{padding:16px 22px;background:#fff;border-bottom:1px solid #c8d2cf;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{margin:0;font-size:22px}nav{display:flex;gap:18px;margin-left:auto}a{color:#276e72;text-decoration:none}a:hover{text-decoration:underline}main{max-width:1120px;margin:auto;padding:20px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}label{display:flex;gap:7px;align-items:center}select,button{font:inherit;border:1px solid #8eaaa4;border-radius:4px;background:white;color:inherit;height:34px;padding:3px 8px}button{cursor:pointer;width:34px;font-size:18px}button:hover{background:#d9e8e3}input[type=range]{width:120px;accent-color:#26757a}.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#c3cebe;border:1px solid #c3cebe}.view{background:#8e9b64;text-align:center;padding:12px 4px;min-width:0}.view.dark{background:#293832;color:#dce5e0}.view>canvas{display:block;width:100%;height:190px;object-fit:contain}.caption{font-size:12px;margin:8px 0 0}.strip{margin-top:20px;background:#b1b0a0;padding:15px;overflow:auto}.strip canvas{display:block;image-rendering:auto}.counter{font-variant-numeric:tabular-nums;min-width:70px}#error{color:#9c3223}.native{display:flex;align-items:flex-end;justify-content:center;height:65px}.native canvas{display:block;image-rendering:auto}h2{font-size:15px;margin:24px 0 12px}@media(max-width:650px){header{padding:14px}main{padding:12px}nav{margin-left:0;gap:14px}.views{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{gap:10px}.view>canvas{height:155px}}
.view>canvas{max-width:100%}
</style></head><body>
<header><h1>Brushwork Layered</h1><nav><a href="brushwork-full-world.html">Outpost</a><a href="../../?artPack=brushwork-layered">Play</a><a href="brushwork-walk.html">Walk Reference</a><a href="rigged-motion.html">Rigged Trial</a></nav></header>
<main><div class="controls">
<label>Unit <select id="unit"></select></label><label>Action <select id="action"></select></label>
<button id="play" title="Pause" aria-label="Pause">&#10074;&#10074;</button>
<button id="previous" title="Previous frame" aria-label="Previous frame">&#9664;</button>
<button id="next" title="Next frame" aria-label="Next frame">&#9654;</button>
<label>Frame <input id="frame" type="range" min="0" max="15" value="0"></label><output class="counter" id="counter"></output>
<label>Background <select id="background"><option value="day">Day</option><option value="night">Night</option></select></label>

</div><div id="views" class="views"></div><h2>Complete Cycle</h2><label>Facing <select id="strip-facing"></select></label><div class="strip"><canvas id="strip"></canvas></div><p id="error" hidden></p></main>
